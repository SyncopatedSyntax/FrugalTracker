<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5E7A5F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Frugal" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>FrugalTracker</title>
    <script>
      // Apply persisted theme (light/dark + color theme) before paint to avoid flash.
      (function () {
        try {
          var t = localStorage.getItem('ft-theme');
          var dark =
            t === 'dark' ||
            (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          var appTheme = localStorage.getItem('ft-app-theme');
          if (appTheme) document.documentElement.setAttribute('data-app-theme', appTheme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
